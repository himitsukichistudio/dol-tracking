<head>
<meta charset="utf-8">

<title>MASH DOL Post Tracking</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{--bg:#f7f8fa;--surface:#fff;--band:#f0f2f5;--fg:#16202c;--muted:#5d6876;--line:#dde2e8;--accent:#0a3a7a;--link:#1554b5;--done:#1d7a46;
--sans:"Noto Sans","Noto Sans JP",system-ui,-apple-system,"Hiragino Sans",sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#10151c;--surface:#161d26;--band:#1c2430;--fg:#e6ebf1;--muted:#9aa6b4;--line:#2b3542;--accent:#8fb4ee;--link:#8fb8ff;--done:#5fcf8f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:13px;line-height:1.5}
.wrap{padding:28px 16px 48px;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px}
h1{margin:0;font-size:20px;font-weight:700;color:var(--accent)}
h2{margin:0;font-size:15px;font-weight:700;display:flex;align-items:baseline;gap:12px}
h2 .count{font-size:12px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:10px}
.meta{color:var(--muted);font-size:12px}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
th{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
tr.band td{background:var(--band)}
tr:last-child td{border-bottom:0}
td.url{white-space:normal;word-break:break-all;min-width:280px}
td.url a{color:var(--link);text-decoration:none}
td.url a:hover,td.url a:focus-visible{text-decoration:underline}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pending{color:var(--muted)}
.sort{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.sort button{font:inherit;font-size:12px;border:0;background:transparent;color:var(--muted);padding:6px 14px;cursor:pointer}
.sort button+button{border-left:1px solid var(--line)}
.sort button[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:700}
.sort button:focus-visible{outline:2px solid var(--link);outline-offset:-2px}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MASH DOL Post Tracking</h1>
    <span class="meta">Last updated: 28th October 2026</span>
  </header>
  <div class="tools"><span class="meta">Sort by</span><div class="sort" role="group" aria-label="Sort by"><button type="button" id="s-date" aria-pressed="true">Post date</button><button type="button" id="s-name" aria-pressed="false">DOL name</button><button type="button" id="s-src" aria-pressed="false">SNS source</button></div></div>
  <section>
    <h2>Wave 1.5 <span class="count" id="c15"></span></h2>
    <div class="tbl"><table><thead><tr><th>DOL name</th><th>SNS source</th><th>Post date (expected)</th><th>URL</th></tr></thead><tbody id="w15"></tbody></table></div>
  </section>

  </section>
</div>

const MONTHS={January:1,February:2,March:3,April:4,May:5,June:6,July:7,August:8,September:9,October:10,November:11,December:12};
function key(d){const m=d.match(/(\d+)\w*\s+(\w+)\s+(\d{4})/);return m?(+m[3])*10000+MONTHS[m[2]]*100+(+m[1]):0;}
function sorted(rows,mode){
  const r=rows.map((x,i)=>[x,i]);
  r.sort((a,b)=>{
    if(mode==='name'){return a[0][0].localeCompare(b[0][0])||key(a[0][2])-key(b[0][2])||a[1]-b[1];}
    if(mode==='src'){return a[0][1].localeCompare(b[0][1])||key(a[0][2])-key(b[0][2])||a[0][0].localeCompare(b[0][0])||a[1]-b[1];}
    return key(a[0][2])-key(b[0][2])||a[0][0].localeCompare(b[0][0])||a[1]-b[1];
  });
  return r.map(x=>x[0]);
}
function render(rows,id,cid,mode){
  const tb=document.getElementById(id);tb.textContent='';let prev=null,band=false,done=0;
  for(const r of sorted(rows,mode)){
    const g=mode==='name'?r[0]:mode==='src'?r[1]:r[2];
    if(g!==prev){band=!band;prev=g;}
    const tr=document.createElement('tr');if(!band)tr.className='band';
    for(const i of [0,1,2,3]){
      const td=document.createElement('td');const v=r[i];
      if(i===3){td.className='url';if(v){done++;const a=document.createElement('a');a.href=v;a.target='_blank';a.rel='noopener';a.textContent=v;td.appendChild(a);}else{const s=document.createElement('span');s.className='pending';s.textContent='—';td.appendChild(s);}}
      else td.textContent=v;
      tr.appendChild(td);
    }
    tb.appendChild(tr);
  }
  document.getElementById(cid).textContent=done+' / '+rows.length+' posted';
}
function draw(mode){
  document.getElementById('s-date').setAttribute('aria-pressed',mode==='date');
  document.getElementById('s-name').setAttribute('aria-pressed',mode==='name');
  document.getElementById('s-src').setAttribute('aria-pressed',mode==='src');
  render(W15,'w15','c15',mode);render(W1,'w1','c1',mode);
}
document.getElementById('s-date').addEventListener('click',()=>draw('date'));
document.getElementById('s-name').addEventListener('click',()=>draw('name'));
document.getElementById('s-src').addEventListener('click',()=>draw('src'));
draw('date');
