name: Daily sponsored-post report

on:
  schedule:
    - cron: '0 22 * * *'   # 07:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send report
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_MODE: ${{ vars.REPORT_MODE }}
          THREAD_MESSAGE_ID: ${{ vars.THREAD_MESSAGE_ID }}
        run: python scripts/report.py
      - name: Save reported list
        run: |
          git config user.name "studio HIMITSUKICHI"
          git config user.email "miura@himitsukichistudio.com"
          git add reported.json
          git diff --cached --quiet || (git commit -m "Update reported posts" && git push)
