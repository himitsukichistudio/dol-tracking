}

:root[data-theme="dark"]{

body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:13px;line-height:1.5}
.wrap{padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

h1{margin:0;font-size:20px;font-weight:700;color:var(--accent);text-wrap:balance}
.meta{color:var(--muted);font-size:12px}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
th{position:sticky;top:0;background:var(--surface);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
tr.band td{background:var(--band)}
td.url{white-space:normal;word-break:break-all;min-width:280px;max-width:460px}
td.url a{color:var(--link);text-decoration:none}
td.url a:hover,td.url a:focus-visible{text-decoration:underline}
td.num{font-variant-numeric:tabular-nums;text-align:right}
th.num{text-align:right}
.pending{color:var(--muted)}
tr:last-child td{border-bottom:0}
</style>
</head>
